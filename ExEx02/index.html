<!doctype html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartão de apresentação</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside>
      <img src="imagens/homem.jpg" alt="Foto de Alex Martins" />
      <div id="dev-info">
        <h1>Alex Martins</h1>
        <p id="profissao">Front-End Developer</p>
        <p id="descricao">
          Desenvolvedor apaixonado por criar interfaces modernas, simples e
          facéis de utilizar.
        </p>
      </div>
      <div id="habilidades">
        <div class="nome-porcent"><span>HTML5</span><span>90%</span></div>
        <div class="barra">
          <div class="progresso" style="width: 90%"></div>
        </div>
        <div class="nome-porcent"><span>CSS3</span><span>65%</span></div>
        <div class="barra">
          <div class="progresso" style="width: 65%"></div>
        </div>
        <div class="nome-porcent"><span>JavaScript</span><span>10%</span></div>
        <div class="barra">
          <div class="progresso" style="width: 10%"></div>
        </div>
      </div>
      <div id="redes-sociais">
        <nav>
          <ul>
            <li>
              <a href="#">GitHub</a>
            </li>
            <li>
              <a href="#">Instagram</a>
            </li>
            <li>
              <a href="#">LinkedIn</a>
            </li>
          </ul>
        </nav>
      </div>
    </aside>
    <main>
      <h2>Estátisticas</h2>
      <div id="estatisticas-lista">
        <div class="estatistica">
          <h3>12 <span>Projetos</span></h3>
        </div>
        <div class="estatistica">
          <h3>2 anos <span>Experiência</span></h3>
        </div>
        <div class="estatistica">
          <h3>8 <span>Tecnologias</span></h3>
        </div>
        <div class="estatistica">
          <h3>24 <span>Clientes</span></h3>
        </div>
      </div>
      <a href="#">Ver portfólio</a>
    </main>
  </body>
</html>

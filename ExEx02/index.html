<!doctype html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartão de produto</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <div id="card-img">
        <img
          src="imagens/Sapatilhas_Samba_OG_Branco_B75806_01_00_standard.jpg"
          alt="Adidas Samba OG"
        />
      </div>
      <div id="card-info">
        <h1>Adidas Samba OG</h1>
        <p id="descricao">
          Um clássico intemporal com um design simples e versátil, perfeito para
          completar qualquer look.
        </p>
        <p id="preco">120€</p>
      </div>
      <button type="button">Adicionar ao carrinho</button>
    </div>
  </body>
</html>

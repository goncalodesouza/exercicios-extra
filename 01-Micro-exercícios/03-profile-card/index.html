<!doctype html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <article>
      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSF2ycm3e24esBc4TvygV8cbWO2k6vcH8vmRo7krJqPCg&s=10"
        alt="Foto de João Silva"
      />
      <div id="card-content">
        <h1>João Silva</h1>
        <p id="profissao">Frontend Developer</p>
        <p id="descricao">
          Desenvolvedor Frontend apaixonado por criar interfaces modernas,
          simples e funcionais. Gosto de transformar ideias em experiências web
          intuitivas e agradáveis de utilizar.
        </p>
        <p id="localizacao">Braga, Portugal</p>
        <button>Contactar</button>
      </div>
    </article>
  </body>
</html>

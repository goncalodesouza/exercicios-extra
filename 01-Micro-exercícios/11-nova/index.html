<!doctype html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>11 - Nova</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="card">
      <div id="card-name">
        <h2>NOVA</h2>
        <div id="detail"></div>
      </div>
      <hr />
      <div id="card-content">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQqXA4qSk3sLxc2ZZwDTckeSqvphJ8ctoUnPYyk3vRr5w&s=10"
          alt="Foto de Alex Morgan"
        />
        <h1>Alex Morgan</h1>
        <p class="arroba">@alexcreates</p>
        <p class="description">Design, tecnologia e ideias fora da caixa.</p>
      </div>
      <div id="card-stat">
        <div class="stat">
          <p class="number">12,8 mil</p>
          <p class="thing">Seguidores</p>
        </div>
        <div class="stat">
          <p class="number">184</p>
          <p class="thing">Publicações</p>
        </div>
        <div class="stat">
          <p class="number">26,4 mil</p>
          <p class="thing">Gostos</p>
        </div>
      </div>
      <hr />
      <div id="card-buttons">
        <button id="follow">Seguir</button>
        <button id="see-profile">Ver perfil</button>
      </div>
    </div>
  </body>
</html>

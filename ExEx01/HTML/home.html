<!doctype html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TravelFlix</title>
    <link rel="stylesheet" href="../CSS/home.css" />
    <script src="../JavaScript/home.js"></script>
    <script
      src="https://kit.fontawesome.com/606c2b6b04.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <h1>Travel<span>Flix</span></h1>
      <nav>
        <ul>
          <li>
            <a href="#">
              <i class="fa-solid fa-magnifying-glass"></i>
            </a>
          </li>
          <li>
            <a href="#"><i class="fa-solid fa-heart"></i></a>
          </li>
          <li>
            <details id="profile">
              <summary>
                <i class="fa-solid fa-circle-user"></i>
              </summary>

              <div class="profile-menu">
                <a href="#">Perfil <i class="fa-solid fa-circle-user"></i></a>
                <a href="#">Lista <i class="fa-solid fa-heart"></i></a>
                <a href="#">Ajustes <i class="fa-solid fa-gear"></i></a>
                <a href="index.html"
                  >Sair <i class="fa-solid fa-right-from-bracket"></i
                ></a>
              </div>
            </details>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <section id="hero">
        <div class="hero-content">
          <h3>Portugal</h3>
          <p>Portugal · Europa · Cultura · História · Natureza</p>
        </div>
        <div class="hero-buttons">
          <button type="button" id="learn-more">Saber Mais</button>
          <button type="button" id="add-list">Minha Lista</button>
        </div>
      </section>
    </main>
    <footer>
      <nav>
        <ul>
          <li>
            <a href="#"><i class="fa-solid fa-house"></i></a>
          </li>
          <li>
            <a href="#"><i class="fa-solid fa-magnifying-glass"></i></a>
          </li>
          <li>
            <a href="#"><i class="fa-solid fa-heart"></i></a>
          </li>
          <li>
            <a href="#"><i class="fa-solid fa-circle-user"></i></a>
          </li>
        </ul>
      </nav>
    </footer>
  </body>
</html>

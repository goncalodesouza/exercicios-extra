<!doctype html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TravelFlix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=visibility"
    />
  </head>
  <body>
    <header>
      <h1>TravelFlix</h1>
      <p>Bem-vindo de volta!</p>
      <p>Entra na tua conta para continuar a explorar.</p>
    </header>
    <main>
      <div class="inputs">
        <div class="login-input">
          <label for="iemail">Email</label>
          <input type="email" id="iemail" placeholder="O teu email" />
        </div>
        <form>
          <label for="ipassword">Palavra-passe</label>
          <input
            type="password"
            id="ipassword"
            placeholder="A tua palavra-passe"
          />
          <span class="material-symbols-outlined">visibility</span>
        </form>
        <div class="forgot-pass">
          <a href="#">Esqueceste-te da palavra-passe?</a>
        </div>
        <div class="login-button">
          <button type="submit">Entrar</button>
        </div>
      </div>
      <p>-ou-</p>
      <div class="continue-with">
        <div class="google">
          <a href="#">Continuar com o Google</a>
        </div>
        <div class="apple">
          <a href="#">Continuar com a Apple</a>
        </div>
      </div>
      <div class="no-account">
        <p>Ainda não tens conta?</p>
        <a href="#">Criar conta</a>
      </div>
    </main>
  </body>
</html>

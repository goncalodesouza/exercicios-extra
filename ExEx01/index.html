<!doctype html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TravelFlix</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1>TravelFlix</h1>
      <p>Bem-vindo de volta!</p>
      <p>Entra na tua conta para continuar a explorar.</p>
    </header>
    <main>
      <form>
        <div class="login-input">
          <div class="email">
            <label for="iemail">Email</label>
            <input type="email" id="iemail" placeholder="O teu email" />
          </div>
          <div class="password">
            <label for="ipassword">Palavra-passe</label>
            <div class="input-span">
              <input
                type="password"
                id="ipassword"
                placeholder="A tua palavra-passe"
              />
              <span class="material-symbols-outlined">visibility</span>
            </div>
          </div>
        </div>
        <div class="forgot-pass">
          <a href="#">Esqueceste-te da palavra-passe?</a>
        </div>
        <div class="login-button">
          <button type="submit">Entrar</button>
        </div>
      </form>
      <p id="ou">-ou-</p>
      <div class="continue-with">
        <div class="google">
          <a href="#">Continuar com o Google</a>
        </div>
        <div class="apple">
          <a href="#">Continuar com a Apple</a>
        </div>
      </div>
      <div class="no-account">
        <p>Ainda não tens conta?</p>
        <a href="#">Criar conta</a>
      </div>
    </main>
  </body>
</html>

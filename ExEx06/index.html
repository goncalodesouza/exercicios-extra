<!doctype html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card de artigo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Card de artigo</h1>
    <div id="card">
      <div id="card-img">
        <img src="" alt="Imagem do artigo" />
      </div>
      <div id="card-text">
        <strong>TECNOLOGIA</strong>
        <h2>Como a inteligência artificial está a mudar a Web</h2>
        <p>
          Descobre como novas ferramentas de inteligência artificial estão a
          transformar a forma como criamos e utilizamos websites.
        </p>
      </div>
      <div id="card-link">
        <a href="#">Ler artigo →</a>
      </div>
    </div>
  </body>
</html>

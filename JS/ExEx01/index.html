<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Control</title>
  </head>
  <body>
    <h1>Stock Control</h1>
    <p>Introduz a quantidade de produtos em stock:</p>
    <input type="number" name="quantidade" id="quantidade" />
    <input type="button" value="Verificar stock" id="botao" />
    <div id="resultado"></div>

    <script>
      var b = window.document.getElementById("botao");
      b.addEventListener("click", clicar);
      function clicar() {
        var q = Number(window.document.getElementById("quantidade").value);
        var r = window.document.getElementById("resultado");
        if (q < 0) {
          r.innerText = "Quantidade inválida";
        } else if (q === 0) {
          r.innerText = "Sem stock";
        } else if (q >= 1 && q <= 5) {
          r.innerText = "Stock reduzido";
        } else if (q >= 6 && q <= 20) {
          r.innerText = "Stock disponível";
        } else {
          r.innerText = "Stock elevado";
        }
      }
    </script>
  </body>
</html>
